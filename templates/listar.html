<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alunos</title>
  <!-- Bootstrap: o visual vem pronto, pela internet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Alunos</h1>
      <a href="/" class="btn btn-outline-secondary btn-sm">Voltar ao início</a>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-dark">
            <tr><th>Id</th><th>Nome</th><th>Telefone</th><th>Cidade</th></tr>
          </thead>
          <tbody>
            {% for aluno in alunos %}
            <tr>
              <td>{{ aluno.id }}</td>
              <td>{{ aluno.nome }}</td>
              <td>{{ aluno.telefone }}</td>
              <td>{{ aluno.cidade }}</td>
            </tr>
            {% else %}
            <tr>
              <td colspan="4" class="text-center">Nenhum aluno cadastrado.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>

    <p class="text-muted mt-2">Total: {{ alunos|length }} aluno(s)</p>

  </div>
</body>
</html>
